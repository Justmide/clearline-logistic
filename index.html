<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary SEO Meta Tags -->
    <title>ClearLine Express | China to UK Package Moving &amp; Freight Logistics</title>
    <meta name="title" content="ClearLine Express | China to UK Package Moving &amp; Freight Logistics" />
    <meta
      name="description"
      content="Fast, reliable package moving and freight forwarding from China to the UK. Air freight (8–15 days), land trucking (30–50 days), sea cargo (45–70 days), warehouse consolidation in China, UK customs clearance &amp; doorstep delivery."
    />
    <meta
      name="keywords"
      content="ClearLine Express, china to uk package moving, china to uk shipping, parcel forwarding china to uk, air freight china to uk, sea freight china to uk, land freight china to uk, china warehouse consolidation, uk customs clearance ddp, door to door delivery uk"
    />
    <meta name="author" content="ClearLine Express Logistics" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.clearlineexpress.com/" />

    <!-- Geo Meta Tags for UK / Cross-Border Trade Corridor -->
    <meta name="geo.region" content="GB" />
    <meta name="geo.placename" content="London, United Kingdom" />

    <!-- Favicon & Mobile Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0B192C" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.clearlineexpress.com/" />
    <meta property="og:site_name" content="ClearLine Express" />
    <meta property="og:title" content="ClearLine Express | China to UK Package Moving &amp; Freight Logistics" />
    <meta
      property="og:description"
      content="End-to-end package moving &amp; freight solutions connecting China to the United Kingdom. Express air shipping, overland trucking, economical sea freight, customs clearance, and direct UK doorstep delivery."
    />
    <meta property="og:image" content="https://www.clearlineexpress.com/favicon.png" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.clearlineexpress.com/" />
    <meta name="twitter:title" content="ClearLine Express | China to UK Package Moving &amp; Freight Logistics" />
    <meta
      name="twitter:description"
      content="Reliable, rapid parcel moving and cargo forwarding from China to the UK. Air freight, land shipping, sea freight, consolidation, and DDP customs clearance."
    />
    <meta name="twitter:image" content="https://www.clearlineexpress.com/favicon.png" />

    <!-- Preconnect to improve asset delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Inter Display & IBM Plex Mono for High-Precision Logistics UI -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (Schema.org) for Logistics Service -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LogisticsService",
        "name": "ClearLine Express",
        "url": "https://www.clearlineexpress.com/",
        "logo": "https://www.clearlineexpress.com/favicon.png",
        "image": "https://www.clearlineexpress.com/favicon.png",
        "description": "Cross-border package moving and cargo logistics corridor between China and the United Kingdom. Specializing in air express, overland trucking, sea freight, China warehouse consolidation, and UK DDP customs clearance.",
        "telephone": "+44 7548 643 563",
        "email": "ops@clearlineexpress.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Heathrow Logistics Centre",
          "addressLocality": "London",
          "postalCode": "TW6 2GW",
          "addressCountry": "GB"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "51.4700",
          "longitude": "-0.4543"
        },
        "areaServed": [
          {
            "@type": "Country",
            "name": "United Kingdom"
          },
          {
            "@type": "Country",
            "name": "China"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "China to UK Logistics Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "UK Air Freight Shipping",
                "description": "Fast 8-15 day door-to-door air freight for personal parcels, commercial samples, and time-sensitive packages from China to any UK destination."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Overland Land Shipping (Truck)",
                "description": "Balanced 30-50 day overland trucking convoy freight connecting China to the UK at flat £8/kg rates."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Economy Sea Freight Shipping",
                "description": "Cost-effective sea shipping (FCL/LCL) for heavy items, large package shipments, and commercial cargo from Chinese ports to UK ports."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "China Warehouse Consolidation & Repacking",
                "description": "Combine multiple supplier and factory orders at our Shenzhen & Guangzhou hubs with free inspection and repackaging to reduce shipping costs."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "UK Customs Clearance & DDP Service",
                "description": "Complete HMRC customs handling, import duty/VAT processing with Delivered Duty Paid (DDP) options to eliminate unexpected delivery charges."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "UK Last-Mile Doorstep Delivery",
                "description": "Insured domestic delivery directly to homes and commercial premises across England, Scotland, Wales, and Northern Ireland."
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
